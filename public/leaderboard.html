<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bảng Xếp Hạng Cao Thủ - Edu-Flow</title>
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
    <style>
        .leaderboard-header {
            background: linear-gradient(135deg, #FF8A00 0%, #E67E00 100%);
            padding: 80px 0;
            color: white;
            border-radius: 0 0 50px 50px;
            margin-bottom: 50px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(255, 122, 0, 0.15);
        }
        .leaderboard-header::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            border-radius: 50%;
        }
        .leaderboard-container {
            padding-bottom: 100px;
        }
        .leaderboard-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.03);
            margin-bottom: 50px;
            border: 1px solid rgba(255, 122, 0, 0.1);
        }
        .top-podium {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 20px;
            margin-bottom: 50px;
            padding-top: 20px;
        }
        .podium-place {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: white;
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,0,0,0.05);
            width: 180px;
            transition: all 0.3s ease;
        }
        .podium-place:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(255, 122, 0, 0.1);
        }
        .podium-place.first {
            order: 2;
            height: 240px;
            border-color: #FFD700;
            background: linear-gradient(180deg, #FFFDF0 0%, #FFFFFF 100%);
            box-shadow: 0 20px 45px rgba(255, 215, 0, 0.15);
        }
        .podium-place.second {
            order: 1;
            height: 200px;
            border-color: #C0C0C0;
            background: linear-gradient(180deg, #F9F9F9 0%, #FFFFFF 100%);
        }
        .podium-place.third {
            order: 3;
            height: 180px;
            border-color: #CD7F32;
            background: linear-gradient(180deg, #FAF4EE 0%, #FFFFFF 100%);
        }
        .avatar-wrapper {
            position: relative;
            margin-bottom: 15px;
        }
        .crown {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%) rotate(-5deg);
            font-size: 24px;
        }
        .podium-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.5rem;
            color: white;
        }
        .first .podium-avatar { background: linear-gradient(135deg, #FFD700, #FFA500); }
        .second .podium-avatar { background: linear-gradient(135deg, #C0C0C0, #808080); }
        .third .podium-avatar { background: linear-gradient(135deg, #CD7F32, #A0522D); }
        .podium-username {
            font-weight: 700;
            color: var(--secondary);
            margin-bottom: 5px;
            font-size: 1.05rem;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 100%;
        }
        .podium-pts {
            font-weight: 800;
            color: var(--primary);
            font-size: 1.1rem;
        }
        .podium-badge {
            margin-top: 10px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .first .podium-badge { background: #FFF9E6; color: #CC9900; }
        .second .podium-badge { background: #F2F2F2; color: #666666; }
        .third .podium-badge { background: #FAF0E6; color: #B35A00; }

        @media (max-width: 600px) {
            .top-podium {
                flex-direction: column;
                align-items: center;
            }
            .podium-place {
                width: 100%;
                height: auto !important;
                order: unset !important;
            }
        }
    </style>
</head>
<body style="background: #F8FAFC;">
    <nav class="navbar">
        <div class="container">
            <a href="index.html" class="logo">Edu<span>Flow</span></a>
            <ul class="nav-links" id="nav-links">
                <!-- Injected by JS -->
            </ul>
        </div>
    </nav>

    <header class="leaderboard-header">
        <div class="container">
            <h1 style="font-size: 2.8rem; font-weight: 800; margin-bottom: 15px;">Bảng Xếp Hạng Cao Thủ</h1>
            <p style="font-size: 1.1rem; opacity: 0.95; max-width: 600px; margin: 0 auto;">Vinh danh những chiến binh học tập chăm chỉ và xuất sắc nhất tuần này.</p>
        </div>
    </header>

    <main class="container leaderboard-container">
        <!-- Podium for top 3 -->
        <div class="top-podium" id="top-podium" style="display: none;">
            <!-- Podium places will be injected here -->
        </div>

        <div class="leaderboard-card reveal">
            <table class="ranking-table">
                <thead>
                    <tr>
                        <th>Hạng</th>
                        <th>Người dùng</th>
                        <th>Cấp độ</th>
                        <th>Tổng điểm</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Data will be injected here -->
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 40px;">Đang tải dữ liệu...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <a href="index.html" class="logo">Edu<span>Flow</span></a>
            <p>&copy; 2026 Edu-Flow Platform. Mang lại kiến thức cho mọi người.</p>
        </div>
    </footer>

    <script>
        const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.protocol === 'file:') ? 'http://localhost:5000/api' : '/api';

        document.addEventListener('DOMContentLoaded', async () => {
            updateNavbar();
            fetchLeaderboard();
            initScrollReveal();
        });

        function updateNavbar() {
            const navLinks = document.getElementById('nav-links');
            const user = JSON.parse(localStorage.getItem('user'));
            if (user) {
                navLinks.innerHTML = `
                    <li><a href="index.html#subjects">Kiểm tra</a></li>
                    <li><a href="practice.html">Luyện tập</a></li>
                    <li><a href="skill-tree.html">Bản đồ học tập</a></li>
                    <li><a href="roadmap.html">Lộ trình</a></li>
                    <li><a href="leaderboard.html" style="color: var(--primary); font-weight: 700;">Bảng xếp hạng</a></li>
                    <li><a href="profile.html" class="btn btn-outline" style="padding: 8px 18px; border-radius: 12px;">Trang cá nhân</a></li>
                    <li><a href="#" onclick="logout()" class="btn btn-primary" style="padding: 8px 18px; border-radius: 12px;">Đăng xuất</a></li>
                `;
            } else {
                navLinks.innerHTML = `
                    <li><a href="index.html#subjects">Kiểm tra</a></li>
                    <li><a href="practice.html">Luyện tập</a></li>
                    <li><a href="skill-tree.html">Bản đồ học tập</a></li>
                    <li><a href="leaderboard.html" style="color: var(--primary); font-weight: 700;">Bảng xếp hạng</a></li>
                    <li><a href="auth.html" class="btn btn-outline" style="padding: 8px 18px; border-radius: 12px;">Đăng nhập</a></li>
                    <li><a href="auth.html" class="btn btn-primary" style="padding: 8px 18px; border-radius: 12px;">Bắt đầu ngay</a></li>
                `;
            }
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }

        async function fetchLeaderboard() {
            const leaderboardBody = document.getElementById('leaderboard-body');
            const topPodium = document.getElementById('top-podium');
            
            try {
                const response = await fetch(`${API_URL}/leaderboard`);
                const leaders = await response.json();

                if (leaders.length > 0) {
                    leaderboardBody.innerHTML = '';
                    topPodium.innerHTML = '';
                    
                    // Render Top 3 Podium
                    const top3 = leaders.slice(0, 3);
                    if (top3.length > 0) {
                        topPodium.style.display = 'flex';
                        
                        top3.forEach((user, index) => {
                            const placeClass = index === 0 ? 'first' : index === 1 ? 'second' : 'third';
                            const rankText = index === 0 ? 'Quán Quân' : index === 1 ? 'Á Quân' : 'Hạng 3';
                            
                            const podiumDiv = document.createElement('div');
                            podiumDiv.className = `podium-place ${placeClass}`;
                            podiumDiv.innerHTML = `
                                <div class="avatar-wrapper">
                                    ${index === 0 ? `<div class="crown">👑</div>` : ''}
                                    <div class="podium-avatar">${user.username.charAt(0).toUpperCase()}</div>
                                </div>
                                <div class="podium-username">${user.full_name || user.username}</div>
                                <div class="podium-pts">${user.total_points.toLocaleString()} pts</div>
                                <div class="podium-badge">${rankText}</div>
                            `;
                            topPodium.appendChild(podiumDiv);
                        });
                    }

                    // Render All in Table
                    leaders.forEach(user => {
                        const row = document.createElement('tr');
                        row.className = `rank-${user.rank_position}`;
                        
                        row.innerHTML = `
                            <td><div class="rank-badge">${user.rank_position}</div></td>
                            <td>
                                <div class="user-cell">
                                    <div class="user-avatar">${user.username.charAt(0).toUpperCase()}</div>
                                    <span>${user.full_name || user.username}</span>
                                </div>
                            </td>
                            <td>Level ${user.level}</td>
                            <td class="points-cell">${user.total_points.toLocaleString()} pts</td>
                        `;
                        leaderboardBody.appendChild(row);
                    });
                } else {
                    leaderboardBody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px;">Chưa có dữ liệu xếp hạng. Hãy hoàn thành bài thi đầu tiên!</td></tr>';
                }
            } catch (error) {
                console.error('Error fetching leaderboard:', error);
                leaderboardBody.innerHTML = '<tr><td colspan="4" style="text-align: center; padding: 40px; color: var(--danger);">Lỗi kết nối máy chủ.</td></tr>';
            }
        }

        function initScrollReveal() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('active');
                    }
                });
            }, { threshold: 0.1 });

            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
